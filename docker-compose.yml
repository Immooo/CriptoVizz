services:
  ### MySQL Container
  mysql:
    container_name: mysql
    image: mysql:8.4
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./script/createTableCrypto.sql:/docker-entrypoint-initdb.d/createTableCrypto.sql
    networks:
      - mysql_go_net
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  ### Python Container (Scrap)
  scrap:
    build: ./app/scrap
    container_name: scrap
    restart: always
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      RAW_NEWS_QUEUE: ${RAW_NEWS_QUEUE:-raw_news}
      NEWS_FEED_URLS: ${NEWS_FEED_URLS:-https://www.coindesk.com/arc/outboundfeeds/rss/}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-60}
    networks:
      - rabbitmq_go_net
    depends_on:
      rabbitmq:
        condition: service_healthy

  ### Online Analytics Builder (consumer and producer)
  analytics:
    build: ./app/analytics
    container_name: analytics
    restart: always
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      RAW_NEWS_QUEUE: ${RAW_NEWS_QUEUE:-raw_news}
      ANALYTICS_QUEUE: ${ANALYTICS_QUEUE:-enriched_news}
    depends_on:
      rabbitmq:
        condition: service_healthy
      scrap:
        condition: service_started
    networks:
      - rabbitmq_go_net

  ### Analytics storage consumer
  queue:
    build: ./app/queue
    container_name: queue
    restart: always
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      ANALYTICS_QUEUE: ${ANALYTICS_QUEUE:-enriched_news}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      analytics:
        condition: service_started
    networks:
      - rabbitmq_go_net
      - mysql_go_net

  ### Python Container (Clean)
  clean:
    build: ./app/clean
    container_name: clean
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mysql_go_net

  ### Grafana Container
  grafana:
      image: grafana/grafana:12.1.0
      container_name: grafana
      ports:
        - 3000:3000
      restart: unless-stopped
      volumes:
        - grafana-data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning:ro
        - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      depends_on:
        mysql:
          condition: service_healthy
      networks:
        - mysql_go_net  # AJOUT DU RÉSEAU MYSQL
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rabbitmq_go_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  grafana-data:
  rabbitmq-data:

networks:
  rabbitmq_go_net:
    driver: bridge
  mysql_go_net:
    driver: bridge
