apiVersion: 1

datasources:
  - name: Crypto News MySQL
    uid: mysql-crypto-news
    type: mysql
    access: proxy
    url: mysql:3306
    user: $MYSQL_USER
    secureJsonData:
      password: $MYSQL_PASSWORD
    jsonData:
      database: $MYSQL_DATABASE
      maxOpenConns: 20
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
    editable: false
